<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto</title>
    <link rel="stylesheet" href="css/estilos.css">


</head>

<body>
   <div class="cabecero">

    <div class="presupuesto">
       <div class="presupuesto_titulo">Presupuesto Disponible</div>
       <div class="presupuesto_valor" id="presupuesto">$0.00</div>

      <div class="presupuesto_ingreso limpiarEstilos">
          <div class="presupuesto_ingreso--texto">Ingresos</div>
       <div class="derecha limpiarEstilos">
          <div class="presupuesto_ingreso--valor" id="ingresos">$0.00</div>
          <div class="presupuesto_ingreso--porcentaje"></div>
        </div>
      </div>

      <div class="presupuesto_egreso limpiarEstilos">
        <div class="presupuesto_egreso--texto">Egresos</div>
        <div class="derecha limpiarEstilos">
          <div class="presupuesto_egreso--valor" id="egresos">$0.00</div>
          <div class="presupuesto_egreso--porcentaje" id="porcentaje">0%</div>
        </div>
      </div>
    </div>

  </div>



    <form id="forma" onsubmit="return false">
        <div class="agregar">
            <div class="agregar_contenedor">
                <select class="agregar_tipo" id="tipo">
                    <option value="ingreso" selected>+</option>
                    <option value="egreso">-</option>
                </select>
                <input type="text" class="agregar_descripcion" id="descripcion"
                    placeholder="Agregar Descripcion">
                <input type="number" class="agregar_valor" placeholder="Valor"
                    id="valor" step="any">
                
                <button onclick="agregarDato()" class="agregar_btn" >
                    <ion-icon name="checkmark-circle-outline"></ion-icon>
                </button>
            </div>
        </div>
    </form>
    
   
    <div class="contenedor limpiarEstilos">
        <div class="ingreso">
            <h2 class="ingreso_titulo">INGRESOS</h2>
            <div id="lista-ingresos" class="contenedoringreso">
                <div class="elemento limpiarEstilos">
                    <div class="elemento_descripcion">
                        <p>Salario</p>
                    </div>
                    <div class="derecha limpiarEstilos">
                        <div class="elemento_valor">
                            <p>+ $2,200.00 Mxn</p>
                        </div>
                        <div class="elemento_eliminar">
                            <button class="elemento_eliminar--btn"> 
                                <ion-icon name="close-circle-outline"></ion-icon>
                            </button>
                        </div>
                    </div>
                </div>


                <div class="elemento limpiarEstilos">
                    <div class="elemento_descripcion">
                        <p>Venta Automovil</p>
                    </div>
                    <div class="derecha limpiarEstilos">
                        <div class="elemento_valor">
                            <p>+ $1,500.00 Mxn</p>
                        </div>
                        <div class="elemento_eliminar">
                            <button class="elemento_eliminar--btn"> 
                                <ion-icon name="close-circle-outline"></ion-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>   
        </div>


        <div class="egreso">
            <h2 class="egreso_titulo">EGRESOS</h2>
            <div id="lista-egresos">
                <div class="elemento limpiarEstilos">
                    <div class="elemento_descripcion">
                        <p>Renta departamento</p>
                    </div>
                    <div class="derecha limpiarEstilos">
                        <div class="elemento_valor">
                            <p>- $900.00 Mxn</p>
                        </div>
                        <div class="elemento_porcentaje">21%</div>
                        <div class="elemento_eliminar">
                            <button class="elemento_eliminar--btn"> 
                                <ion-icon name="close-circle-outline"></ion-icon>
                            </button>
                        </div>
                    </div>
                </div>
               
                <div class="elemento limpiarEstilos">
                    <div class="elemento_descripcion">
                        <p>Ropa</p>
                    </div>
                    <div class="derecha limpiarEstilos">
                        <div class="elemento_valor">
                            <p>- $400.00 Mxn</p>
                        </div>
                        <div class="elemento_porcentaje">9%</div>
                        <div class="elemento_eliminar">
                            <button class="elemento_eliminar--btn">
                               <ion-icon name="close-circle-outline"></ion-icon> 
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>    
        
        </div>
    </div>
   
   
    <footer style="text-align: center;">
       <p>© 2026 - Copyright/Todos los derechos reservados Alejandro G.</p>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"></script>
   
    
    <script src="js/dato.js"></script>
    <script src="js/ingreso.js"></script>
    <script src="js/egreso.js"></script>
    <script src="js/app.js"></script>
    
</body>   
</html>
